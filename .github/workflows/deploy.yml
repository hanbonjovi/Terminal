name: Deploy to Cloudflare Workers & GitHub Pages

on:
  push:
    branches: ['main', 'claude/*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Build for Cloudflare Worker (base=/, proxy=/api)
      - run: VITE_BASE=/ npm run build
        env:
          VITE_AI_PROXY_URL: /api

      # Copy built frontend into worker's public directory
      - run: |
          rm -rf worker/public
          cp -r dist worker/public

      # Deploy worker + static assets to Cloudflare
      - run: cd worker && npm install && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Rebuild for GitHub Pages (base=/Terminal/)
      - run: npm run build
        env:
          VITE_AI_PROXY_URL: https://stonks.hanbonjovi.workers.dev/api

      # Deploy to GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
